name: Build and Deploy Flask Portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flask_app_portfolio/**"
      - "k8s-apps/flask_app_portfolio/**"
      - ".github/workflows/flask-app-portfolio.yml"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-app-portfolio:${{ github.sha }} ./flask_app_portfolio
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app-portfolio:${{ github.sha }}

      - name: Update Kubernetes manifest image tag
        run: |
          sed -i "s|image: .*/flask-app-portfolio:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app-portfolio:${{ github.sha }}|" k8s-apps/flask_app_portfolio/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s-apps/flask_app_portfolio/deployment.yaml
          git commit -m "Update flask app portfolio image to ${{ github.sha }}" || echo "No changes to commit"
          git push
