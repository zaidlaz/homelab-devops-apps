name: Build and Deploy My Recipe App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "my_recipe/**"
      - "k8s-apps/my_recipe/**"
      - ".github/workflows/my-recipe.yml"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          sudo docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-recipe:${{ github.sha }} ./my_recipe
          sudo docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-recipe:${{ github.sha }}

      - name: Update Kubernetes manifest image tag
        run: |
          sed -i "s|image: .*/my-recipe:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/my-recipe:${{ github.sha }}|" k8s-apps/my_recipe/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s-apps/my_recipe_app/deployment.yaml
          git commit -m "Update my-recipe image to ${{ github.sha }}" || echo "No changes to commit"
          git push
