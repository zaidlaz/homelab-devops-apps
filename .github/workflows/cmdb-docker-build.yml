name: Build and Deploy CMDB

on:
  push:
    branches:
      - main
    paths:
      - "cmdb/**"
      - "k8s-apps/cmdb/**"
      - ".github/workflows/cmdb-docker-build.yml"

permissions:
  contents: write

env:
  IMAGE_NAME: zaid/homelab-cmdb

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.TAG }} ./cmdb

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.TAG }}

      - name: Update Kubernetes manifest image
        run: |
          sed -i "s|image: zaid/homelab-cmdb:.*|image: zaid/homelab-cmdb:${{ steps.vars.outputs.TAG }}|" k8s-apps/cmdb/cmdb-deployment.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s-apps/cmdb/cmdb-deployment.yaml
          git commit -m "Update CMDB image to ${{ steps.vars.outputs.TAG }}" || echo "No changes to commit"
          git push
