<!doctype html>
<html>
<head>
  <title>HomeLab CMDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h1 class="mb-4">HomeLab CMDB Dashboard</h1>

  <div class="row">
    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5>Assets</h5>
          <h2>{{ total_assets }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5>Services</h5>
          <h2>{{ total_services }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5>Domains</h5>
          <h2>{{ total_domains }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-center">
        <div class="card-body">
          <h5>Certificates</h5>
          <h2>{{ total_certificates }}</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a href="/assets" class="btn btn-primary">Manage Assets</a>
    <a href="/services" class="btn btn-secondary">Services</a>
    <a href="/domains" class="btn btn-secondary">Domains</a>
    <a href="/certificates" class="btn btn-secondary">Certificates</a>
    <a href="/health" class="btn btn-success">Health</a>
  </div>
</div>
</body>
</html>
