<!doctype html>
<html>
<head>
  <title>HomeLab CMDB - Assets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h1>Assets</h1>
  <a href="/" class="btn btn-secondary mb-3">Back to Dashboard</a>

  <div class="card mb-4">
    <div class="card-header">Add New Asset</div>
    <div class="card-body">
      <form method="POST">
        <div class="row">
          <div class="col-md-3 mb-2">
            <input name="hostname" class="form-control" placeholder="Hostname" required>
          </div>
          <div class="col-md-3 mb-2">
            <input name="ip_address" class="form-control" placeholder="IP Address">
          </div>
          <div class="col-md-3 mb-2">
            <input name="asset_type" class="form-control" placeholder="Type e.g. VM, K8S, Router">
          </div>
          <div class="col-md-3 mb-2">
            <input name="status" class="form-control" placeholder="Status e.g. Running">
          </div>
        </div>
        <button class="btn btn-primary">Add Asset</button>
      </form>
    </div>
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Hostname</th>
        <th>IP Address</th>
        <th>Type</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for asset in assets %}
      <tr>
        <td>{{ asset.hostname }}</td>
        <td>{{ asset.ip_address }}</td>
        <td>{{ asset.asset_type }}</td>
        <td>{{ asset.status }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
