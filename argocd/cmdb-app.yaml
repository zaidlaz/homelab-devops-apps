apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmdb
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:zaidlaz/homelab-devops-apps.git
    targetRevision: main
    path: k8s-apps/cmdb

  destination:
    server: https://kubernetes.default.svc
    namespace: cmdb

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
