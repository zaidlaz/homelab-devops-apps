name: Build and Deploy Zen E-commerce

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "zen_ecommerce/**"
      - "k8s-apps/zen_ecommerce/**"
      - ".github/workflows/zen-ecommerce.yml"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend
        run: |
         docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/zen-ecommerce-backend:${{ github.sha }} ./zen_ecommerce/src/backend
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/zen-ecommerce-backend:${{ github.sha }}

      - name: Build frontend
        run: |
         docker build --build-arg NEXT_PUBLIC_API_URL=http://api.zen.lab -t ${{ secrets.DOCKERHUB_USERNAME }}/zen-ecommerce-frontend:${{ github.sha }} ./zen_ecommerce/src/frontend
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/zen-ecommerce-frontend:${{ github.sha }}


      - name: Update Kubernetes manifest image tag
        run: |
          sed -i "s|image: .*/zen-ecommerce:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/zen-ecommerce:${{ github.sha }}|" k8s-apps/zen_ecommerce/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s-apps/zen_ecommerce/deployment.yaml
          git commit -m "Update zen-ecommerce image to ${{ github.sha }}" || echo "No changes to commit"
          git push
