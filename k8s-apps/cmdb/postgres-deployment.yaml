apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-postgres
  namespace: cmdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cmdb-postgres
  template:
    metadata:
      labels:
        app: cmdb-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: cmdb-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: cmdb-postgres-pvc
