apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmdb-sa
  namespace: cmdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmdb-k8s-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmdb-k8s-reader-binding
subjects:
  - kind: ServiceAccount
    name: cmdb-sa
    namespace: cmdb
roleRef:
  kind: ClusterRole
  name: cmdb-k8s-reader
  apiGroup: rbac.authorization.k8s.io
