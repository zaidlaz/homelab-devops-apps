apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-recipe-app
  namespace: my-recipe-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-recipe-app
  template:
    metadata:
      labels:
        app: my-recipe-app
    spec:
      containers:
        - name: my-recipe-app
          image: zaid/my-recipe-app:4e41a18ebd479ab6e4508a3e6a891a5d5a1cdf34
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: recipe-app-secrets
                  key: secret-key
            - name: DATA_DIR
              value: /app/data
            - name: UPLOAD_FOLDER
              value: /app/uploads
            - name: FLASK_ENV
              value: production
          volumeMounts:
            - name: recipe-data
              mountPath: /app/data
            - name: recipe-uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: recipe-data
          persistentVolumeClaim:
            claimName: recipe-app-data
        - name: recipe-uploads
          emptyDir: {}
