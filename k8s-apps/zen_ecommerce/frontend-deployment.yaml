apiVersion: apps/v1
kind: Deployment
metadata:
  name: zen-ecommerce-frontend
  namespace: zen-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zen-ecommerce-frontend
  template:
    metadata:
      labels:
        app: zen-ecommerce-frontend
    spec:
      containers:
      - name: frontend
        image: zaid/zen-ecommerce-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
