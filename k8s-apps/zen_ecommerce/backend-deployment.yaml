apiVersion: apps/v1
kind: Deployment
metadata:
  name: zen-ecommerce-backend
  namespace: zen-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zen-ecommerce-backend
  template:
    metadata:
      labels:
        app: zen-ecommerce-backend
    spec:
      containers:
      - name: backend
        image: zaid/zen-ecommerce-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
