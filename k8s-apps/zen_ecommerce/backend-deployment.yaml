apiVersion: apps/v1
kind: Deployment
metadata:
  name: zen-ecommerce-backend
  namespace: zen-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zen-ecommerce-backend
  template:
    metadata:
      labels:
        app: zen-ecommerce-backend
    spec:
      containers:
      - name: backend
        image: zaid/zen-ecommerce-backend:85332f89e33138d6766cbb549a627c9668e0f2f8
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: db

        - name: DB_PORT
          value: "5432"

        - name: DB_NAME
          value: ecommerce_db

        - name: DB_USER
          value: ecom_user

        - name: DB_PASSWORD
          value: SuperSecret123
        - name: ADMIN_EMAIL
          value: "admin@example.com"
        - name: ADMIN_PASSWORD
          value: "YourSecurePassword123!"
