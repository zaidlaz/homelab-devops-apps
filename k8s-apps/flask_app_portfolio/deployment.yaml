apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-portfolio
  namespace: flask-app-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app-portfolio
  template:
    metadata:
      labels:
        app: flask-app-portfolio
    spec:
      containers:
        - name: flask-app-portfolio
          image: zaid/flask-app-portfolio:c640051a880813afe11df85784495e9891edc89c
          ports:
            - containerPort: 5004
