apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-portfolio
  namespace: flask-app-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app-portfolio
  template:
    metadata:
      labels:
        app: flask-app-portfolio
    spec:
      containers:
        - name: flask-app-portfolio
          image: zaid/flask-app-portfolio:ff5afcfc7258271c8a6706a91882aba8e15034c6
          ports:
            - containerPort: 5004
