  creationTimestamp: "2026-06-13T08:47:53Z"
  generation: 17
  name: my-recipe-backup
  namespace: my-recipe
  resourceVersion: "6073337"
  uid: 6f244876-beae-4133-a467-8351d0f2806b
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      template:
        metadata:
          creationTimestamp: null
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              set -ex
              apk add --no-cache openssh-client rsync sqlite

              DATE=$(date +%Y%m%d-%H%M%S)
              BACKUP_DIR=/backup/$DATE

              mkdir -p $BACKUP_DIR
              cp /data/recipes.db $BACKUP_DIR/recipes.db
              cp -r /uploads $BACKUP_DIR/uploads

              sqlite3 $BACKUP_DIR/recipes.db "PRAGMA integrity_check;"

              cp /ssh/id_ed25519 /tmp/id_ed25519
              chmod 600 /tmp/id_ed25519

              rsync -avz \
                -e "ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no" -o BatchMode=yes -o ConnectTimeout=10 \
                $BACKUP_DIR/ \
                viduka@192.168.13.210:/home/viduka/backups/my-recipe/$DATE/

              echo "Backup completed locally: $BACKUP_DIR"
              echo "Backup copied to mgmt01:/home/viduka/backups/my-recipe/$DATE"
            image: alpine:3.20
            imagePullPolicy: IfNotPresent
            name: backup
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /uploads
              name: uploads
            - mountPath: /backup
              name: backup
            - mountPath: /ssh
              name: ssh-key
              readOnly: true
          dnsPolicy: ClusterFirstWithHostNet
          hostNetwork: true
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: my-recipe-data-pvc
          - name: uploads
            persistentVolumeClaim:
              claimName: my-recipe-uploads-pvc
          - name: backup
            persistentVolumeClaim:
              claimName: my-recipe-backup-pvc
          - name: ssh-key
            secret:
              defaultMode: 420
              secretName: my-recipe-backup-ssh
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
status:
  lastScheduleTime: "2026-07-06T02:00:00Z"
  lastSuccessfulTime: "2026-06-13T08:55:41Z"
