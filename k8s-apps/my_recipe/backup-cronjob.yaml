apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-recipe-backup
  namespace: my-recipe
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: busybox:1.36
            command:
              - /bin/sh
              - -c
              - |
                DATE=$(date +%Y%m%d-%H%M%S)
                mkdir -p /backup/$DATE
                cp /data/recipes.db /backup/$DATE/recipes.db
                cp -r /uploads /backup/$DATE/uploads
                echo "Backup completed: /backup/$DATE"
            volumeMounts:
            - name: data
              mountPath: /data
            - name: uploads
              mountPath: /uploads
            - name: backup
              mountPath: /backup
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: my-recipe-data-pvc
          - name: uploads
            persistentVolumeClaim:
              claimName: my-recipe-uploads-pvc
          - name: backup
            persistentVolumeClaim:
              claimName: my-recipe-backup-pvc
