apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linux-kb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zaid/homelab-devops.git
    targetRevision: main
    path: linux-kb-gitops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: linux-kb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
